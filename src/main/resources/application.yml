spring:
  application:
    name: smartglove-backend


  mongodb:
    uri: mongodb://${MONGO_USER:admin}:${MONGO_PASSWORD:secretpassword}@${MONGO_HOST:localhost}:${MONGO_PORT:27018}/smartglove?authSource=admin

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadminpassword}
  bucket-name: gesture-models

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8000}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: ${JWT_EXPIRATION:86400000}