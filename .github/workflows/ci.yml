name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Отримуємо код
      - name: Отримання коду з репозиторію
        uses: actions/checkout@v4

      # 2. Встановлюємо Java
      - name: Налаштування Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ==========================================
      # БЛОК CI (Виконується ЗАВЖДИ: на кожний коміт і PR)
      # ==========================================
      - name: Запуск тестів та збірка (CI)
        run: mvn clean package

      # ==========================================
      # БЛОК CD (Виконується ТІЛЬКИ при злитті в main)
      # ==========================================
      - name: Авторизація в Docker Hub (CD)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Збірка та відправка образу (CD)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smartglove-backend:latest